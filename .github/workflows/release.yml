name: Release npm packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version from the root package.json, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Match repository version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "Release $RELEASE_VERSION does not match root package version $package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify workspace
        run: bun run release:check

      - name: Verify Bun publish manifests
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          packages=(
            packages/schema
            packages/database
            packages/core
            packages/runtime
            packages/data-agent
            packages/mysql
            packages/postgres
            packages/capability-broker
            packages/compiler
            apps/studio
            packages/cli
          )
          for package_path in "${packages[@]}"; do
            archive="$(bun pm pack --cwd "$package_path" --destination "$pack_dir" --ignore-scripts --quiet | tail -n 1)"
            if tar -xOf "$archive" package/package.json | grep -q 'workspace:'; then
              echo "Bun publish manifest still contains workspace protocol: $package_path" >&2
              exit 1
            fi
          done

      - name: Publish packages in dependency order
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "NPM_TOKEN is not available to this workflow." >&2
            exit 1
          fi
          packages=(
            packages/schema
            packages/database
            packages/core
            packages/runtime
            packages/data-agent
            packages/mysql
            packages/postgres
            packages/capability-broker
            packages/compiler
            apps/studio
            packages/cli
          )
          for package_path in "${packages[@]}"; do
            bun publish --cwd "$package_path" --access public --ignore-scripts --no-save
          done

      - name: Verify published CLI metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          verify_dir="$(mktemp -d)"
          trap 'find "$verify_dir" -depth -delete' EXIT
          cd "$verify_dir"
          npm init --yes >/dev/null
          for attempt in $(seq 1 12); do
            if npx --yes "data-elements@$RELEASE_VERSION" studio --help; then
              exit 0
            fi
            sleep 5
          done
          echo "The published CLI did not become installable from npm." >&2
          exit 1
