name: Release npm packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version from the root package.json, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          root_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$version" != "$root_version" ]; then
            echo "Release $version does not match root package version $root_version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check product naming
        run: bun run check:naming

      - name: Check package boundaries
        run: bun run check:boundaries

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:ci

      - name: Build
        run: bun run build

      - name: Check release artifacts
        run: bun scripts/check-release.ts && bun scripts/check-release-stage.ts

      - name: Stage and pack release
        id: stage
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/open-generative-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bun scripts/release-stage.ts --version "$RELEASE_VERSION" --output "$release_directory"
          echo "manifest=$release_directory/release-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Validate packed release
        run: bun scripts/release-publish.ts --manifest "${{ steps.stage.outputs.manifest }}" --verify-only

      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/release-publish.ts --manifest "${{ steps.stage.outputs.manifest }}" --provenance
