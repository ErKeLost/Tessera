name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify pinned submodules
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -Eq '^[+-]'; then
            echo "A submodule is uninitialized or does not match its pinned commit."
            exit 1
          fi

      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit high-severity dependencies
        run: bun audit --audit-level=high

      - name: Typecheck
        run: bun run typecheck

      - name: Test protocol, packages, registry, and fresh installs
        run: bun run test

      - name: Build publishable packages
        run: bun run build:packages

      - name: Build documentation
        run: bun run build:docs

      - name: Smoke-test production documentation
        run: bun run smoke:docs

      - name: Write build provenance
        run: bun run provenance -- --output .artifacts/build-provenance.json

      - name: Upload build provenance
        uses: actions/upload-artifact@v4
        with:
          name: build-provenance-${{ github.sha }}
          path: .artifacts/build-provenance.json
          if-no-files-found: error
          retention-days: 30
