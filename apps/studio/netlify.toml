[build]
  base = "apps/studio"
  command = "cd ../.. && bun install --frozen-lockfile && bun run build:packages && NITRO_PRESET=netlify bun run --cwd apps/studio build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.4.0"
  NODE_VERSION = "24"
  NITRO_PRESET = "netlify"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
